<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustDesk · 远程桌面</title>
  <link rel="icon" href="assets/rustdesk-logo.svg">
  <style>
    /* Three canvases, one composition: a copy column and a card that frames the
       untouched upstream client screenshot. Scene picks the palette, format picks
       the grid and the type scale. */
    :root {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color-scheme: light;
      --paper:#e9eff7; --ink:#0b1220; --accent:#0b63f6; --muted:#44576f;
      --line:#c6d4e6; --stage:#ffffff; --stage-line:#cddaeb; --shadow:rgba(9,22,44,.26);
      --crack:color-mix(in srgb, var(--accent) 12%, var(--stage));
      --pad:4.8vw; --gap:1.9vh; --radius:3vw;
      --brand:3.4vw; --eyebrow:1.7vw; --title:7.4vw; --body:2.1vw; --chip:1.65vw; --foot:1.5vw;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; }
    body { background:var(--paper); color:var(--ink); }
    body[data-scene="keyboard"] {
      --paper:#0a1322; --ink:#ffffff; --accent:#54c8ff; --muted:#b8c8dd;
      --line:#31465f; --stage:#16233a; --stage-line:#33486a; --shadow:rgba(0,0,0,.6);
      --crack:color-mix(in srgb, var(--accent) 16%, var(--stage));
    }
    body[data-scene="pointer"] {
      --paper:#0a5ce4; --ink:#ffffff; --accent:#d3ebff; --muted:#e6f1ff;
      --line:#6699f6; --stage:#1462dd; --stage-line:#6ea0f5; --shadow:rgba(2,18,54,.5);
      --crack:color-mix(in srgb, var(--ink) 14%, var(--stage));
    }
    body[data-scene="pointer"] .brand img { filter:brightness(0) invert(1); }

    .poster {
      width:100vw; height:100vh; overflow:hidden;
      display:grid; grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto auto minmax(0,1fr) auto;
      gap:var(--gap); padding:var(--pad);
      background:
        radial-gradient(120% 78% at 108% -12%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 62%),
        radial-gradient(90% 62% at -18% 112%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
    }

    .masthead { display:flex; align-items:baseline; justify-content:space-between; gap:2vw; }
    .brand { display:flex; align-items:center; gap:.95vw; font-size:var(--brand); font-weight:650; letter-spacing:-.045em; }
    .brand img { width:1.18em; height:1.18em; display:block; }
    .edition { font-size:calc(var(--brand) * .48); letter-spacing:.14em; color:color-mix(in srgb, var(--ink) 76%, transparent); white-space:nowrap; }

    .copy { display:flex; flex-direction:column; justify-content:center; min-width:0; }
    .eyebrow { display:flex; align-items:center; gap:1vw; margin:0 0 calc(var(--gap) * .5); }
    .eyebrow b { font-size:var(--eyebrow); font-weight:650; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:.04em; }
    .eyebrow i { flex:0 0 auto; width:2.2vw; height:2px; background:linear-gradient(90deg, var(--accent), transparent); }
    .eyebrow span { font-size:var(--eyebrow); font-weight:600; color:var(--muted); letter-spacing:.14em; }
    h1 { margin:0; font-size:var(--title); font-weight:680; line-height:1.12; letter-spacing:-.05em; }
    h1 span { display:block; }
    h1 .accent { color:var(--accent); }
    .description { margin:calc(var(--gap) * .45) 0 0; max-width:26ch; font-size:var(--body); line-height:1.7; color:var(--muted); white-space:pre-line; }
    .features { display:flex; flex-wrap:wrap; gap:1vw; padding:0; margin:calc(var(--gap) * .65) 0 0; list-style:none; }
    .features li {
      padding:.5vw 1.1vw; border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
      border-radius:999px; background:var(--crack);
      font-size:var(--chip); line-height:1.5; color:var(--ink); font-weight:540; letter-spacing:.02em;
    }

    .device-stage {
      min-height:0; justify-self:center; align-self:stretch;
      display:flex; align-items:center; justify-content:center;
      padding:1.7vh 1.5vw; border:1px solid var(--stage-line); border-radius:var(--radius);
      background:var(--stage); box-shadow:0 2vw 3.6vw -2.2vw var(--shadow);
      width:fit-content;
    }
    .device { height:100%; max-height:100%; padding:.58vw; border-radius:calc(var(--radius) * .58); background:linear-gradient(160deg, #22314b, #0d1526); box-shadow:0 2vw 3.8vw -1.4vw var(--shadow), inset 0 0 0 1px rgba(255,255,255,.09); }
    .device img { height:100%; width:auto; display:block; border-radius:calc(var(--radius) * .46); }

    footer { display:flex; align-items:center; justify-content:space-between; gap:2vw; font-size:var(--foot); color:color-mix(in srgb, var(--ink) 84%, transparent); }
    .progress { display:flex; align-items:center; gap:6px; }
    .progress i { height:3px; width:20px; border-radius:2px; background:var(--line); }
    .progress i.active { width:44px; background:var(--accent); }

    .icon { display:none; }
    body[data-format="icon"] .poster { display:none; }
    body[data-format="icon"] .icon { display:block; width:100vw; height:100vh; object-fit:contain; }

    /* Wide canvases: copy left, card right, both centred on the same row. */
    body:not([data-format="phone"]) {
      --pad:4.6vw; --gap:2.6vh; --radius:1.9vw;
      --brand:2.15vw; --eyebrow:1vw; --title:4.5vw; --body:1.34vw; --chip:.98vw; --foot:.92vw;
    }
    body:not([data-format="phone"]) .poster {
      grid-template-columns:minmax(0,45%) minmax(0,55%);
      grid-template-rows:auto minmax(0,1fr) auto;
      column-gap:2.8vw;
    }
    body:not([data-format="phone"]) .masthead { grid-column:1 / -1; }
    body:not([data-format="phone"]) .copy { grid-column:1; padding-right:1vw; }
    body:not([data-format="phone"]) .device-stage { grid-column:2; padding:1.6vh 1.4vw; }
    body:not([data-format="phone"]) footer { grid-column:1 / -1; }
    body:not([data-format="phone"]) .features li { padding:.4vw .85vw; }
    body[data-format="tablet"] { --title:4.25vw; --body:1.28vw; }
    body[data-format="tablet"] .device-stage { padding:1.4vh 1.8vw; }
  </style>
</head>
<body>
  <main class="poster">
    <header class="masthead">
      <div class="brand"><img src="assets/rustdesk-logo.svg" alt="">RustDesk</div>
      <span class="edition">远程桌面，自在掌控</span>
    </header>
    <section class="copy" aria-label="功能介绍">
      <p class="eyebrow"><b id="number"></b><i></i><span id="label"></span></p>
      <h1><span id="headline"></span><span class="accent" id="highlight"></span></h1>
      <p class="description" id="description"></p>
      <ul class="features" id="features" aria-label="功能要点"></ul>
    </section>
    <div class="device-stage">
      <div class="device"><img class="screenshot" id="screenshot" alt=""></div>
    </div>
    <footer><span>RustDesk Flutter · 上游客户端界面示例</span><span class="progress" aria-hidden="true"><i></i><i></i><i></i></span></footer>
  </main>
  <img class="icon" id="icon" alt="RustDesk 原始应用图标">
  <script>
    const scenes = {
      quality: { index:'01', label:'显示与画质', headline:'画质，', highlight:'随你掌控。', description:'清晰画面，还是更快响应？\n按你的需要，切换显示偏好。', features:['画质选择', '响应优先', '显示器切换'], alt:'上游 RustDesk 客户端真实截图：图像质量、响应偏好和显示器选择' },
      keyboard: { index:'02', label:'远程键盘', headline:'远程输入，', highlight:'得心应手。', description:'从常用按键，到熟悉的组合键。\n让屏幕另一端，也好操作。', features:['修饰键', '快捷组合', '屏幕键盘'], alt:'上游 RustDesk 客户端真实截图：屏幕键盘和 Ctrl、Alt、Shift 等修饰键，远端为测试账户' },
      pointer: { index:'03', label:'指针与触控', headline:'点按之间，', highlight:'掌控远端。', description:'点击、拖动、滚动。\n把熟悉的桌面操作，带到手边。', features:['点击', '拖动', '滚动'], alt:'上游 RustDesk 客户端真实截图：指针工具栏，远端显示公开 RustDesk 仓库页面' }
    };
    const formats = { phone:[1080,1920], tablet:[1920,1280], landscape:[1920,1080], icon:[1024,1024] };
    const params = new URLSearchParams(location.search);
    const scene = Object.hasOwn(scenes,params.get('scene')) ? params.get('scene') : 'quality';
    const fallback = innerWidth < innerHeight ? 'phone' : innerWidth/innerHeight < 1.65 ? 'tablet' : 'landscape';
    const format = Object.hasOwn(formats,params.get('format')) ? params.get('format') : fallback;
    const data = scenes[scene];
    document.body.dataset.scene = scene;
    document.body.dataset.format = format;
    document.body.dataset.exportSize = formats[format].join('x');
    document.title = `RustDesk · ${format==='icon'?'原始应用图标':data.label}`;
    const activeImages = [...document.querySelectorAll('.brand img')];
    if (format==='icon') {
      const icon = document.getElementById('icon');
      icon.src = 'assets/app-icon.png';
      activeImages.push(icon);
    } else {
      document.getElementById('number').textContent = data.index;
      document.getElementById('label').textContent = data.label;
      document.getElementById('headline').textContent = data.headline;
      document.getElementById('highlight').textContent = data.highlight;
      document.getElementById('description').textContent = format==='phone' ? data.description.replace('\n','') : data.description;
      for (const feature of data.features) {
        const item = document.createElement('li');
        item.textContent = feature;
        document.getElementById('features').append(item);
      }
      document.querySelectorAll('.progress i')[Number(data.index)-1].classList.add('active');
      const screenshot = document.getElementById('screenshot');
      screenshot.src = `assets/${format==='phone'?'phone':'tablet'}-${scene}.png`;
      screenshot.alt = data.alt;
      activeImages.push(screenshot);
    }
    Promise.all([document.fonts.ready,...activeImages.map(image=>image.decode())]).then(()=>{
      document.body.dataset.ready='true';
    }).catch(error=>{
      document.body.dataset.ready='error';
      console.error('Poster asset failed to load',error);
    });
  </script>
</body>
</html>
