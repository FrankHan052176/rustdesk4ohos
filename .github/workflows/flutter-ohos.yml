name: Build Flutter OpenHarmony

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      publish-release:
        type: boolean
        default: false
      upload-agc:
        type: boolean
        default: false
      upload-tag:
        type: string
        default: nightly
      version:
        type: string
        default: 1.4.9
    secrets:
      OHOS_RELEASE_SIGNING_BASE64:
        required: true
      AGC_CLIENT_ID:
        required: false
      AGC_CLIENT_SECRET:
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLUTTER_OH_VERSION: 3.41.10-ohos-0.0.2-beta
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
  HOMEBREW_NO_AUTO_UPDATE: 1
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  VERSION: ${{ inputs.version || '1.4.9' }}

jobs:
  build-rustdesk-ohos-flutter:
    name: Flutter OpenHarmony (aarch64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native build prerequisites
        shell: bash
        run: |
          brew install cmake coreutils ninja pkg-config protobuf
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-ohos
          components: ''

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: flutter-ohos-macos

      - name: Install Flutter-OH and bridge generator
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_OH_VERSION" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter-ohos"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" config --no-analytics
          cargo install flutter_rust_bridge_codegen \
            --version "$FLUTTER_RUST_BRIDGE_VERSION" \
            --features uuid \
            --locked

      - name: Resolve Flutter dependencies
        shell: bash
        working-directory: flutter
        run: |
          python3 ../scripts/prepare-ohos-flutter.py
          flutter pub get

      - name: Cross-compile OHOS Flutter bridge
        shell: bash
        env:
          OHOS_FRB_USE_HOST_SYSROOT: '1'
        run: |
          export OHOS_FRB_HOST_LLVM_PATH="$(cd "$(dirname "$(xcrun --find clang)")/.." && pwd)"
          export OHOS_FRB_HOST_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash scripts/build-ohos-ffi.sh

      - name: Verify OHOS Flutter bridge
        shell: bash
        run: |
          artifact=target/aarch64-unknown-linux-ohos/release/librustdesk_ohos_flutter_bridge.so
          packaged=flutter/ohos/entry/libs/arm64-v8a/liblibrustdesk.so
          test -s "$artifact"
          test -s "$packaged"
          cmp "$artifact" "$packaged"
          file "$artifact"

      - name: Prepare OHOS release signing material
        shell: bash
        env:
          OHOS_RELEASE_SIGNING_BASE64: ${{ secrets.OHOS_RELEASE_SIGNING_BASE64 }}
          RUSTDESK_SIGNING_DIR: ${{ runner.temp }}/rustdesk-ohos-signing
        run: |
          python3 .github/scripts/prepare-ohos-signing.py "$RUSTDESK_SIGNING_DIR"
          echo "RUSTDESK_SIGNING_DIR=$RUSTDESK_SIGNING_DIR" >> "$GITHUB_ENV"

      - name: Package signed Flutter OpenHarmony APP
        shell: bash
        env:
          RUSTDESK_SIGNING_DIR: ${{ runner.temp }}/rustdesk-ohos-signing
          OHOS_PACKAGE_KIND: app
          OHOS_BUILD_MODE: release
          OHOS_PRODUCT: publish
        run: |
          rm -rf flutter/build/ohos
          rm -rf flutter/ohos/build flutter/ohos/entry/build
          bash scripts/build-ohos-flutter-hap.sh

      - name: Verify signed Flutter OpenHarmony APP
        shell: bash
        env:
          RUSTDESK_SIGNING_DIR: ${{ runner.temp }}/rustdesk-ohos-signing
        run: |
          app_list="$(find flutter/ohos/build -type f -name '*-signed.app' 2>/dev/null || true)"
          app_count="$(printf '%s\n' "$app_list" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          if [[ "$app_count" != 1 ]]; then
            echo "Expected exactly one signed App, found $app_count." >&2
            exit 1
          fi
          signed_app="$(printf '%s\n' "$app_list" | sed '/^$/d' | head -n 1)"
          test -s "$signed_app"

          signing_dir="$(cd "$RUSTDESK_SIGNING_DIR" && pwd)"
          publish_profile="$signing_dir/RustDesk_UO_PublishRelease.p7b"
          test -s "$publish_profile"

          sign_tool=""
          for sdk_home in "${HOS_SDK_HOME:-}" "${DEVECO_SDK_HOME:-}" "${OHOS_SDK_HOME:-}"; do
            [[ -n "$sdk_home" ]] || continue
            for candidate in \
              "$sdk_home/default/openharmony/toolchains/lib/hap-sign-tool.jar" \
              "$sdk_home/openharmony/toolchains/lib/hap-sign-tool.jar" \
              "$sdk_home/toolchains/lib/hap-sign-tool.jar"; do
              if [[ -r "$candidate" ]]; then
                sign_tool="$candidate"
                break 2
              fi
            done
          done
          if [[ -z "$sign_tool" ]]; then
            echo "hap-sign-tool.jar was not found in the configured HarmonyOS SDK." >&2
            exit 1
          fi

          python3 scripts/verify-ohos-release.py "$signed_app" \
            --profile "$publish_profile" \
            --sign-tool "$sign_tool"
          OHOS_RELEASE_TEST_APP="$signed_app" \
          OHOS_RELEASE_TEST_PROFILE="$publish_profile" \
          OHOS_RELEASE_TEST_SIGN_TOOL="$sign_tool" \
            python3 scripts/test_ohos_release.py

          cp "$signed_app" "rustdesk-$VERSION-ohos-arm64.app"

      - name: Upload OHOS Flutter bridge
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ohos-flutter-bridge-aarch64
          path: flutter/ohos/entry/libs/arm64-v8a/liblibrustdesk.so
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Flutter OpenHarmony APP
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-flutter-ohos-app
          path: rustdesk-${{ env.VERSION }}-ohos-arm64.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Stores the verified signed App Pack in AppGallery Connect only: no app
      # version is created and nothing is submitted for review.
      - name: Upload Flutter OpenHarmony APP to AppGallery Connect
        if: ${{ inputs.upload-agc }}
        shell: bash
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: '6917615823381371195'
        run: |
          python3 scripts/upload-agc.py "rustdesk-$VERSION-ohos-arm64.app"

      - name: Publish Flutter OpenHarmony APP
        if: ${{ inputs.publish-release }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ inputs.upload-tag }}
          files: rustdesk-${{ env.VERSION }}-ohos-arm64.app

      - name: Remove OHOS release signing material
        if: always()
        shell: bash
        env:
          RUSTDESK_SIGNING_DIR: ${{ runner.temp }}/rustdesk-ohos-signing
        run: |
          case "$RUSTDESK_SIGNING_DIR" in
            */rustdesk-ohos-signing) ;;
            *)
              echo "Unexpected signing directory: $RUSTDESK_SIGNING_DIR" >&2
              exit 1
              ;;
          esac
          rm -rf "$RUSTDESK_SIGNING_DIR"
