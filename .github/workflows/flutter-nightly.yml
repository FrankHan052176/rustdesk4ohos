name: Flutter Nightly Build

# OHOS-only scope while the HarmonyOS pipeline is brought back to green: this
# calls the OpenHarmony workflow directly instead of the multi-platform
# flutter-build.yml. Restore the flutter-build.yml call once the OHOS leg passes
# again, so nightly keeps publishing every platform.
on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-ohos.yml
    secrets: inherit
    with:
      upload-artifact: true
      publish-release: true
      upload-agc: true
      upload-tag: "nightly"
      version: "1.4.9"
