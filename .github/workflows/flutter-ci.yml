name: Full Flutter CI

# OHOS-only scope while the HarmonyOS pipeline is brought back to green: this
# calls the OpenHarmony workflow directly instead of the multi-platform
# flutter-build.yml. Restore the flutter-build.yml call once the OHOS leg passes
# again, so pushes keep checking every platform.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/flutter-ohos.yml
    secrets: inherit
    with:
      upload-artifact: false
      publish-release: false
      upload-agc: false
      upload-tag: nightly
      version: "1.4.9"
