name: Full Flutter CI

# Dormant entry point, kept for the multi-platform matrix: pushes are handled by
# flutter-release.yml, which runs the OpenHarmony workflow and submits the App Pack to
# AppGallery Connect, and the other platforms stay parked in flutter-build.yml. Restore the
# flutter-build.yml call here (with its full matrix) when those platforms come back.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/flutter-ohos.yml
    secrets: inherit
    with:
      upload-artifact: false
      publish-release: false
      upload-agc: false
      upload-tag: nightly
      version: "1.4.9"
